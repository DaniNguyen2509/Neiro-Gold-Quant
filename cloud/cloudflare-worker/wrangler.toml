name = "neiro-gold-feed"
main = "worker.js"
# >= 2024-09-02 enables `allow_custom_ports` so Worker fetch/WebSocket can reach cTrader port 5036
compatibility_date = "2024-11-01"
compatibility_flags = ["allow_custom_ports"]

[vars]
# "auto" = Yahoo GC=F while OAuth token is not yet authorized, then STRICT Pepperstone cTrader XAUUSDF (no Yahoo mixing)
# "ctrader_only" = forbid Yahoo even before OAuth authorization (returns 503 until /callback stores token)
# "yahoo" = force Yahoo GC=F (diagnostic / fallback override)
FEED_MODE = "auto"
# Always keep "demo" unless you explicitly choose a read-only Live token
CTRADER_ENV = "demo"
CTRADER_SYMBOL = "XAUUSDF"
ALLOWED_ORIGIN = "*"

[[durable_objects.bindings]]
name = "FEED_DO"
class_name = "CTraderFeedDO"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Objects are required on the Cloudflare Workers Free plan
new_sqlite_classes = ["CTraderFeedDO"]

