name: ⚡ CME Gold Options Automated Sync & Tactical Terminal (Neiro-Quant)

on:
  schedule:
    # 1. Chot Open Interest ngay moi tu CME Clearing (07:15 VN):
    - cron: '15 0 * * 1-5'
    # 2. Phien A / Tokyo Midday (11:00 VN = 04:00 UTC):
    - cron: '0 4 * * 1-5'
    # 3. Phien Au 2 nac (Pre-Europe & In-Session Europe thich ung ca 2 mua):
    #    05:30 UTC = 12:30 VN (Pre-Europe Mua He: truoc Frankfurt 13:00 & London 14:00)
    #    06:30 UTC = 13:30 VN (Pre-Europe Mua Dong: truoc Frankfurt 14:00 & London 15:00)
    #    07:30 UTC = 14:30 VN (In-Session Europe Mua He sau khi London chay 30p)
    #    08:30 UTC = 15:30 VN (In-Session Europe Mua Dong sau khi London chay 30p)
    - cron: '30 5,6,7,8 * * 1-5'
    # 4. Phien My & Gio Cao Diem Toan Dien (Thich ung Hoan Hao ca 2 Mua He / Dong):
    #    - Pre-US Macro Releases (Don dau tin vi mo 08:30 EST/EDT):
    #      12:15 UTC = 19:15 VN (truoc tin vi mo mua he 19:30 15 phut)
    #      13:15 UTC = 20:15 VN (truoc tin vi mo mua dong 20:30 15 phut)
    #    - Pre-NYSE & US Market Open (Don dau mo phien co phieu / ETF GLD 09:30 EST/EDT):
    #      14:15 UTC = 21:15 VN (truoc gio mo cua mua dong 21:30 15 phut)
    - cron: '15 12,13,14 * * 1-5'
    #    - High-Velocity US Trading, London Fix & Power Hour:
    #      13:45 UTC = 20:45 VN (sau mo cua mua he 20:30 15 phut)
    #      14:45 UTC = 21:45 VN (sau mo cua mua dong 21:30 15 phut)
    #      15:45 UTC = 22:45 VN (London PM Fix mua dong 22:00)
    #      16:45, 17:45 UTC = 23:45, 00:45 VN (Midday New York)
    #    - Power Hour, COMEX Pit Close & Options Settlement (13:30 CST/CDT):
    #      18:45 UTC = 01:45 VN (chot phien COMEX mua he 01:30 VN)
    #      19:45 UTC = 02:45 VN (chot phien COMEX mua dong 02:30 VN)
    - cron: '45 13,14,15,16,17,18,19 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_options_sync.yml'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test mode without committing to repository'
        required: false
        default: false
        type: boolean

concurrency:
  group: options-sync
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Scrape GCZ26 Options & Deploy Tactical Terminal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas plotly yfinance
          python -m playwright install chromium --with-deps

      - name: Scrape Options Chain from Barchart
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.collector.scraper --output data/options_prices_GCZ26.csv --dry-run
          else
            python -m src.collector.scraper --output data/options_prices_GCZ26.csv
          fi

      - name: Verify Generated Options File & Strike Coverage
        run: |
          python -c "
          import pandas as pd, sys, subprocess
          try:
              df = pd.read_csv('data/options_prices_GCZ26.csv')
              strikes = df['strike'].dropna()
              assert len(strikes) >= 10, f'Strike count {len(strikes)} is below minimum 10'
              assert strikes.min() <= 2800.0, f'Min strike {strikes.min()} is above active trading band'
              assert strikes.max() >= 2600.0, f'Max strike {strikes.max()} is below active trading band'
              total_oi = float(df['callOpenInterest'].sum() + df['putOpenInterest'].sum())
              assert total_oi > 0, 'Total Open Interest is zero'
              print(f'[VERIFIED] Data integrity passed: {len(strikes)} strikes ({strikes.min()} to {strikes.max()}), Total OI: {total_oi}')
          except Exception as e:
              print(f'::warning title=Options Scrape Verification Failed::Scraped file verification failed: {e}. Reverting data/options_prices_GCZ26.csv to repository valid state...')
              subprocess.run(['git', 'checkout', 'data/options_prices_GCZ26.csv'], check=False)
          "

      - name: Generate Plotly Tactical HTML Dashboard
        run: |
          python -m src.hud.html_dashboard --input data/options_prices_GCZ26.csv --output exports/latest_gold_dashboard.html exports/index.html index.html --no-mt5
          ls -lh exports/

      - name: Upload Tactical Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gold-tactical-dashboard
          path: |
            exports/latest_gold_dashboard.html
            data/options_prices_GCZ26.csv
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports

      - name: Commit and Push Updated Options Data
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/options_prices_GCZ26.csv index.html
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync CME Gold GCZ26 options chain and index.html [skip ci]" && git pull --rebase origin main && git push)
