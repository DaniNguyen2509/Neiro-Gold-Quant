name: ⚡ CME Gold Options Automated Sync & Tactical Terminal (Neiro-Quant)

on:
  schedule:
    # 00:30 UTC = 07:30 Vietnam (Chot Open Interest moi nhat tu CME Clearing cho ca ngay)
    # 07:30 UTC = 14:30 Vietnam (Dau phien Au Mua He)
    # 08:30 UTC = 15:30 Vietnam (Dau phien Au Mua Dong)
    # Khung Gio Vang phien My (chay moi 1 tieng tu 19:30 den 00:30 dem Vietnam):
    # 12:30, 13:30, 14:30, 15:30, 16:30, 17:30 UTC
    # Chay tu Thu 2 den Thu 6 hang tuan (Thich ung 100% ca Mua He & Mua Dong)
    - cron: '30 0,7,8,12,13,14,15,16,17 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_options_sync.yml'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test mode without committing to repository'
        required: false
        default: false
        type: boolean

concurrency:
  group: options-sync
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Scrape GCZ26 Options & Deploy Tactical Terminal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas plotly
          python -m playwright install chromium --with-deps

      - name: Scrape Options Chain from Barchart
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.collector.scraper --output data/options_prices_GCZ26.csv --dry-run
          else
            python -m src.collector.scraper --output data/options_prices_GCZ26.csv
          fi

      - name: Verify Generated Options File
        run: |
          if [ -f data/options_prices_GCZ26.csv ]; then
            echo "[SUCCESS] File data/options_prices_GCZ26.csv generated successfully!"
            ls -lh data/options_prices_GCZ26.csv
            head -n 5 data/options_prices_GCZ26.csv
          else
            echo "[ERROR] File data/options_prices_GCZ26.csv not found!"
            exit 1
          fi

      - name: Generate Plotly Tactical HTML Dashboard
        run: |
          python -m src.hud.html_dashboard --input data/options_prices_GCZ26.csv --output exports/latest_gold_dashboard.html exports/index.html
          ls -lh exports/

      - name: Upload Tactical Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gold-tactical-dashboard
          path: |
            exports/latest_gold_dashboard.html
            data/options_prices_GCZ26.csv
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports

      - name: Commit and Push Updated Options Data
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/options_prices_GCZ26.csv
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync CME Gold GCZ26 options chain [skip ci]" && git push)
