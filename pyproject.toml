[project]
name = "neiro-quant"
version = "0.1.0"
description = "Quantitative Gold Options Trading System"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "yfinance>=0.2.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --basetemp=C:/Users/Daniel/AppData/Local/Temp/pytest_gold_temp"